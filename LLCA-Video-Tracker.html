document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:1.6;color:#5F5B52\">Green check = watched, amber ring = in progress (with %), hollow grey = not started. Watched titles drop to a lighter ink so unwatched rows carry the weight.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <div>\n      <div style=\"font-family:'Nunito';font-weight:800;font-size:19px\">Screen 3 · completion moment, three states<\u002Fdiv>\n      <div style=\"font-size:13.5px;color:#5F5B52;margin-top:5px\">Overlay on the player. Escalating celebration: points only → badge unlock → the 100% finale.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:28px;flex-wrap:wrap\">\n      <sc-for list=\"{{ demos }}\" as=\"d\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A857A\">{{ d.label }}<\u002Fdiv>\n          <div style=\"padding:8px;background:#1B1A17;border-radius:40px;box-shadow:0 18px 40px rgba(27,26,23,.18)\">\n            <div style=\"position:relative;width:300px;height:600px;border-radius:32px;overflow:hidden;background:#F4F2EC\">\n              <div style=\"width:300px;height:169px;background:#1B1A17;margin-top:52px\"><\u002Fdiv>\n              <div style=\"height:6px;background:#DAD6CB\"><div style=\"height:6px;background:#4B49D6;width:{{ d.behindPct }}\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"padding:16px\"><div style=\"height:16px;width:70%;border-radius:6px;background:#E4E1D8\"><\u002Fdiv><div style=\"height:11px;width:45%;border-radius:6px;background:#E9E6DE;margin-top:10px\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"position:absolute;inset:0;background:rgba(27,26,23,.62);display:flex;align-items:center;justify-content:center;padding:18px\">\n                <div style=\"width:250px;background:#FFFFFF;border-radius:26px;padding:22px 18px;text-align:center;box-shadow: t-weight:800;font-size:14px\">{{ d.primary }}<\u002Fdiv>\n                  <div style=\"margin-top:8px;font-size:12px;font-weight:700;color:#8A857A\">{{ d.secondary }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <div>\n      <div style=\"font-family:'Nunito';font-weight:800;font-size:19px\">Screen 5 · cohort overview (admin only)<\u002Fdiv>\n      <div style=\"font-size:13.5px;color:#5F5B52;margin-top:5px\">No rainbow, no game. Lowest progress first, one row per member, dense enough to screenshot and share.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:760px;background:#FFFFFF;border-radius:20px;box-shadow:0 10px 30px rgba(27,26,23,.08);overflow:hidden\">\n      <div style=\"padding:20px 24px;border-bottom:1px solid #EFEDE6;display:flex;align-items:flex-end;justify-content:space-between;gap:20px\">\n        <div>\n          <div style=\"font-family:'Nunito';font-weight:800;font-size:20px\">Cohort progress<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#8A857A;margin-top:4px\">48 members · sorted lowest progress first · updated 5 Sep 2026<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:right\">\n          <div style=\"font-family:'Nunito';font-weight:800;font-size:20px\">54%<\u002Fdiv>\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A857A\">cohort average<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;padding:10px 24px;background:#FAF9F5;border-bottom:1px solid #EFEDE6;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8A857A\">\n        <div style=\"width:210px\">Member<\u002Fdiv>\n        <div style=\"flex:1\">Progress<\u002Fdiv>\n        <div style=\"width:96px;text-align:right\">Videos<\u002Fdiv>\n        <div style=\"width:56px;text-align:right\">%<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ roster }}\" as=\"r\" hint-placeholder-count=\"12\">\n        <div style=\"display:flex;align-items:center;padding:11px 24px;border-bottom:1px solid #F5F3EE;font-size:14px\">\n          <div style=\"width:210px;font-weight:500;color:{{ r.nameColor }}\">{{ r.name }}<\u002Fdiv>\n          <div style=\"flex:1;padding-right:20px\">\n            <div style=\"height:9px;border-radius:999px;background:#EDEBE4;overflow:hidden\">\n              <div style=\"height:9px;border-radius:999px;background:{{ r.color }};background-size:{{ r.barSize }};width:{{ r.pctCss }}\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:96px;text-align:right;color:#8A857A;font-size:13px\">{{ r.videos }}<\u002Fdiv>\n          <div style=\"width:56px;text-align:right;font-family:'Nunito';font-weight:800;font-size:14px;color:{{ r.pctColor }}\">{{ r.pct }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"padding:14px 24px;display:flex;justify-content:space-between;font-size:12px;color:#A9A49A\">\n        <div>Showing 14 of 48 — the list scrolls; rows stay 40px so 50 members read as one dense table.<\u002Fdiv>\n        <div>Passcode-gated · not linked from member screens<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;memberName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Jane&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;startState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;fresh&quot;,&quot;mid&quot;,&quot;done&quot;],&quot;default&quot;:&quot;mid&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;pointsPerVideo&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:10,&quot;min&quot;:5,&quot;max&quot;:50,&quot;step&quot;:5,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Game rules&quot;},&quot;completionThreshold&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:90,&quot;min&quot;:70,&quot;max&quot;:100,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Game rules&quot;}}\">\nclass Component extends DCLogic {\n  VIDEOS = [\n    { id: 1, year: 2021, title: 'Phishing 101', dur: '6:12', lang: 'EN' },\n    { id: 2, year: 2021, title: 'Password hygiene', dur: '4:48', lang: '中文' },\n    { id: 3, year: 2021, title: 'Locking your screen', dur: '3:05', lang: 'EN' },\n    { id: 4, year: 2022, title: 'Spotting fake invoices', dur: '7:20', lang: 'EN' },\n    { id: 5, year: 2022, title: 'Public Wi-Fi risks', dur: '5:34', lang: '中文' },\n    { id: 6, year: 2022, title: 'Two-factor everything', dur: '4:02', lang: 'EN' },\n    { id: 7, year: 2023, title: 'Social engineering calls', dur: '8:15', lang: '中文' },\n    { id: 8, year: 2023, title: 'Ransomware basics', dur: '6:40', lang: 'EN' },\n    { id: 9, year: 2023, title: 'Safe file sharing', dur: '5:10', lang: 'EN' },\n    { id: 10, year: 2024, title: 'Deepfake voice scams', dur: '7:55', lang: '中文' },\n    { id: 11, year: 2024, title: 'Mobile device safety', dur: '4:25', lang: 'EN' },\n    { id: 12, year: 2024, title: 'Reporting an incident', dur: '3:48', lang: 'EN' },\n    { id: 13, year: 2025, title: 'AI chatbot data leaks', dur: '6:30', lang: '中文' },\n    { id: 14, year: 2025, title: 'QR code traps', dur: '4:10', lang: 'EN' },\n    { id: 15, year: 2025, title: 'Home router setup', dur: '5:55', lang: 'EN' },\n    { id: 16, year: 2025, title: 'Year in review refresher', dur: '9:00', lang: '中文' }\n  ];\n\n  BADGES = [\n    { id: 'first', icon: '🐣', name: 'First Steps', hint: 'Watch your first video', need: 1, line: 'Watched your first video' },\n    { id: 'hat', icon: '⚡', name: 'Hat Trick', hint: 'Three videos in one week', need: 3, line: 'Three videos in one week' },\n    { id: 'c21', icon: '📅', name: 'Class of 2021', hint: 'Finish every 2021 video', need: 3, line: 'Cleared the whole 2021 set' },\n    { id: 'quarter', icon: '🌤️', name: 'Warm Up', hint: 'Reach 25% complete', need: 4, line: 'A quarter of the way there' },\n    { id: 'half', icon: '⛰️', name: 'Halfway There', hint: 'Reach 50% complete', need: 8, line: 'Half the program done' },\n    { id: 'sweep', icon: '🏆', name: 'Clean Sweep', hint: 'Finish all 16 videos', need: 16, line: 'Finished all 16 videos' }\n  ];\n\n  ROSTER = [\n    ['Marcus Oyelaran', 0], ['Dee Whitfield', 6], ['Priya Sankaran', 13], ['Tom Beckett', 19],\n    ['Alina Márquez', 25], ['Joyce Adeyemi', 31], ['Ravi Chandra', 44], ['Ken Ishida', 50],\n    ['Sofia Brennan', 56], ['Nadia Haddad', 69], ['Gus Lindqvist', 75], ['Bea Okonkwo', 88],\n    ['Jane Ferreira', 94], ['Amos Kelly', 100]\n  ];\n\n  state = this.freshState(this.props.startState || 'mid');\n\n  freshState(mode) {\n    return { mode: mode, screen: 'home', videos: this.build(mode), currentId: null, localPct: 0, playing: false, modal: null };\n  }\n\n  build(mode) {\n    const vs = this.VIDEOS.map(v => ({ id: v.id, year: v.year, title: v.title, dur: v.dur, lang: v.lang, status: 'todo', pct: 0 }));\n    if (mode === 'mid') {\n      for (let i = 0; i < 6; i++) { vs[i].status = 'done'; vs[i].pct = 100; }\n      vs[6].status = 'partial'; vs[6].pct = 35;\n    }\n    if (mode === 'done') vs.forEach(v => { v.status = 'done'; v.pct = 100; });\n    return vs;\n  }\n\n  langOf(id) { const v = this.VIDEOS.find(x => x.id === id); return v ? v.lang : 'EN'; }\n\n  pts() { return this.props.pointsPerVideo ?? 10; }\n  threshold() { return this.props.completionThreshold ?? 90; }\n  watched(vs) { return vs.filter(v => v.status === 'done').length; }\n\n  earned(vs) {\n    const n = this.watched(vs);\n    const y21 = vs.filter(v => v.year === 2021 && v.status === 'done').length === 3;\n    return this.BADGES.filter(b => (b.id === 'c21' ? y21 : n >= b.need)).map(b => b.id);\n  }\n\n  componentWillUnmount() { clearInterval(this.timer); }\n\n  stop() { clearInterval(this.timer); this.timer = null; }\n\n  setMode(m) { this.stop(); this.setState(this.freshState(m)); }\n\n  goHome() { this.stop(); this.setState({ screen: 'home', playing: false, modal: null }); }\n  goBadges() { this.stop(); this.setState({ screen: 'badges', playing: false }); }\n\n  openVideo(id) {\n    this.stop();\n    const v = this.state.videos.find(x => x.id === id);\n    this.setState({ screen: 'player', currentId: id, localPct: v.status === 'done' ? 100 : v.pct, playing: false, modal: null });\n  }\n\n  togglePlay() {\n    if (this.timer) { this.stop(); this.setState({ playing: false }); return; }\n    this.setState({ playing: true });\n    this.timer = setInterval(() => this.tick(), 90);\n  }\n\n  tick() {\n    const s = this.state;\n    const cur = s.videos.find(v => v.id === s.currentId);\n    const p = Math.min(100, s.localPct + 3);\n    if (cur && cur.status !== 'done' && p >= this.threshold()) { this.stop(); this.complete(p); return; }\n    if (p >= 100) { this.stop(); this.setState({ localPct: 100, playing: false }); return; }\n    this.setState({ localPct: p });\n  }\n\n  complete(p) {\n    const before = this.earned(this.state.videos);\n    const vs = this.state.videos.map(v => v.id === this.state.currentId ? Object.assign({}, v, { status: 'done', pct: 100 }) : v);\n    const after = this.earned(vs);\n    const nb = this.BADGES.filter(b => after.indexOf(b.id) > -1 && before.indexOf(b.id) < 0).pop();\n    const finale = vs.every(v => v.status === 'done');\n    const cur = vs.find(v => v.id === this.state.currentId);\n    const n = this.watched(vs);\n    this.setState({\n      videos: vs, localPct: p, playing: false,\n      modal: {\n        icon: finale ? '🏆' : (nb ? nb.icon : '✓'),\n        ringBg: finale ? '#FFF0C2' : (nb ? '#EDE9FF' : '#DFF6E7'),\n        head: finale ? '100% complete!' : (nb ? 'Badge unlocked!' : 'Video complete!'),\n        sub: cur.title + ' · ' + cur.year,\n        pts: '+' + this.pts() + ' points',\n        badge: nb ? { icon: nb.icon, name: nb.name, line: nb.line } : null,\n        foot: finale ? 'Every video, every year. Nothing left to phish you with.' : (nb ? n + ' down, ' + (16 - n) + ' to go.' : 'Nice! ' + n + ' videos down.'),\n        primary: finale ? 'See my badges' : 'Play next video',\n        secondary: finale ? 'Back to playlist' : 'Back to playlist',\n        finale: finale\n      }\n    });\n  }\n\n  nextUnwatched() {\n    const s = this.state;\n    const idx = s.videos.findIndex(v => v.id === s.currentId);\n    return s.videos.slice(idx + 1).find(v => v.status !== 'done') || s.videos.find(v => v.status !== 'done') || null;\n  }\n\n  renderVals() {\n    const s = this.state;\n    const vs = s.videos;\n    const n = this.watched(vs);\n    const pct = Math.round(n / vs.length * 100);\n    const earned = this.earned(vs);\n    const nextBadge = this.BADGES.filter(b => earned.indexOf(b.id) < 0)[0];\n\n    let cheer;\n    if (n === 0) cheer = 'Fresh start — your first badge is one video away.';\n    else if (n === vs.length) cheer = 'All 16 done. Officially unphishable. 🎉';\n    else cheer = 'Nice! ' + n + ' videos down.' + (nextBadge ? ' ' + Math.max(1, nextBadge.need - n) + ' more for “' + nextBadge.name + '”.' : '');\n\n    const groups = [2021, 2022, 2023, 2024, 2025].map(y => {\n      const list = vs.filter(v => v.year === y);\n      return {\n        year: y,\n        tally: list.filter(v => v.status === 'done').length + '/' + list.length,\n        videos: list.map(v => ({\n          title: v.title,\n          lang: this.langOf(v.id),\n          langBg: this.langOf(v.id) === 'EN' ? '#EDE9FF' : '#FFE7DA',\n          langFg: this.langOf(v.id) === 'EN' ? '#332FB5' : '#9A3412',\n          langBorder: this.langOf(v.id) === 'EN' ? '#C9C2FF' : '#FFC7A8',\n          meta: v.status === 'partial' ? v.dur + ' · ' + v.pct + '% watched' : (v.status === 'done' ? v.dur + ' · watched' : v.dur),\n          dotBg: v.status === 'done' ? '#2ECC71' : '#FFFFFF',\n          dotFg: v.status === 'done' ? '#FFFFFF' : '#FF9F1C',\n          dotRing: v.status === 'done' ? 'none' : (v.status === 'partial' ? 'inset 0 0 0 2.5px #FF9F1C' : 'inset 0 0 0 2px #E0DDD4'),\n          dotIcon: v.status === 'done' ? '✓' : (v.status === 'partial' ? '◔' : ''),\n          titleColor: v.status === 'done' ? '#8A857A' : '#1B1A17',\n          open: () => this.openVideo(v.id)\n        }))\n      };\n    });\n\n    const cur = vs.find(v => v.id === s.currentId) || vs[0];\n    const nx = this.nextUnwatched();\n\n    const demos = [\n      { label: 'Points only', behindPct: '92%', icon: '✓', ringBg: '#DFF6E7', head: 'Video complete!', sub: 'Ransomware basics · 2023', pts: '+10 points', badge: null, finaleBar: false, foot: 'Nice! 8 videos down. 1 more for “Halfway There”.', primary: 'Play next video', secondary: 'Back to playlist' },\n      { label: 'New badge', behindPct: '92%', icon: '🐣', ringBg: '#EDE9FF', head: 'Badge unlocked!', sub: 'Phishing 101 · 2021', pts: '+10 points', badge: { icon: '🐣', name: 'First Steps', line: 'Watched your first video' }, finaleBar: false, foot: '1 down, 15 to go.', primary: 'Play next video', secondary: 'Back to playlist' },\n      { label: 'Final video · 100%', behindPct: '96%', icon: '🏆', ringBg: '#FFF0C2', head: '100% complete!', sub: 'Year in review refresher · 2025', pts: '+10 points', badge: { icon: '🏆', name: 'Clean Sweep', line: 'Finished all 16 videos' }, finaleBar: true, foot: 'Every video, every year. Nothing left to phish you with.', primary: 'See my badges', secondary: 'Back to playlist' }\n    ];\n\n    const modeDefs = [['fresh', 'Fresh · 0%'], ['mid', 'Mid-progress'], ['done', 'Complete · 100%']];\n\n    return {\n      greeting: 'Hi ' + (this.props.memberName || 'Jane') + ' 👋',\n      cheer: cheer,\n      pct: pct,\n      pctCss: pct + '%',\n      pctLabel: pct + '% complete',\n      doneLabel: n + ' of ' + vs.length + ' videos',\n      points: n * this.pts(),\n      badgeLabel: earned.length + ' / ' + this.BADGES.length,\n      groups: groups,\n      badges: this.BADGES.map(b => {\n        const on = earned.indexOf(b.id) > -1;\n        return {\n          icon: on ? b.icon : '🔒', name: b.name, hint: b.hint,\n          bg: on ? '#FFFFFF' : '#EFEDE6',\n          shadow: on ? '0 6px 18px rgba(27,26,23,.07)' : 'none',\n          opacity: on ? 1 : 0.72,\n          filter: on ? 'none' : 'grayscale(1)',\n          nameColor: on ? '#1B1A17' : '#8A857A',\n          hintColor: on ? '#6E6A61' : '#A9A49A'\n        };\n      }),\n      isHome: s.screen === 'home',\n      isPlayer: s.screen === 'player',\n      isBadges: s.screen === 'badges',\n      current: { title: cur.title, year: cur.year, dur: cur.dur },\n      localPctCss: s.localPct + '%',\n      localLabel: s.localPct >= 100 ? 'Watched' : s.localPct + '% of this video',\n      thresholdNote: 'counts as complete at ' + this.threshold() + '%',\n      playIcon: s.playing ? '❙❙' : '▶',\n      playerHint: s.playing ? 'Watching… the bar above is this video only.' : 'Tap play to run the watch simulation.',\n      curLang: this.langOf(cur.id),\n      curLangBg: this.langOf(cur.id) === 'EN' ? '#EDE9FF' : '#FFE7DA',\n      curLangFg: this.langOf(cur.id) === 'EN' ? '#332FB5' : '#9A3412',\n      upNext: nx ? { title: nx.title, meta: nx.year + ' · ' + nx.dur, lang: this.langOf(nx.id), langBg: this.langOf(nx.id) === 'EN' ? '#EDE9FF' : '#FFE7DA', langFg: this.langOf(nx.id) === 'EN' ? '#332FB5' : '#9A3412', langBorder: this.langOf(nx.id) === 'EN' ? '#C9C2FF' : '#FFC7A8' } : null,\n      openNext: () => { if (nx) this.openVideo(nx.id); },\n      togglePlay: () => this.togglePlay(),\n      goHome: () => this.goHome(),\n      goBadges: () => this.goBadges(),\n      modal: s.modal,\n      dismissModal: () => this.goHome(),\n      modalPrimary: () => {\n        if (s.modal && s.modal.finale) { this.setState({ modal: null }); this.goBadges(); return; }\n        const nn = this.nextUnwatched();\n        this.setState({ modal: null });\n        if (nn) this.openVideo(nn.id); else this.goHome();\n      },\n      demos: demos,\n      modes: modeDefs.map(m => ({\n        label: m[1],\n        bg: s.mode === m[0] ? '#1B1A17' : '#F4F2EC',\n        fg: s.mode === m[0] ? '#FFFFFF' : '#6E6A61',\n        ring: s.mode === m[0] ? 'none' : 'inset 0 0 0 1px #DAD6CB',\n        pick: () => this.setMode(m[0])\n      })),\n      roster: this.ROSTER.map(r => ({\n        name: r[0],\n        pct: r[1] + '%',\n        pctCss: Math.max(r[1], 1.5) + '%',\n        videos: Math.round(r[1] / 100 * 16) + ' of 16',\n        color: r[1] >= 90 ? 'linear-gradient(90deg,#FF4D3D,#FF9F1C,#FFD23F,#2ECC71,#2E86DE,#4B49D6,#8E44E8)' : (r[1] === 0 ? '#D8D4CA' : (r[1] < 30 ? '#FF4D3D' : (r[1] < 70 ? '#FF9F1C' : '#2ECC71'))),\n        barSize: r[1] >= 90 ? '330px 100%' : 'auto',\n        nameColor: r[1] < 30 ? '#1B1A17' : '#3D3A34',\n        pctColor: r[1] === 0 ? '#A9A49A' : '#1B1A17'\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
